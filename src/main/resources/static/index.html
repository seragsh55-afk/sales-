<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>نظام مبيعات وصول</title>
<style>body{font-family:system-ui;background:#f5f5f5;padding:20px}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:20px}input{padding:10px;margin:5px;border:1px solid #ddd;border-radius:8px}button{background:#111;color:white;padding:10px 20px;border-radius:8px;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}</style>
</head><body>
<h2>نظام مبيعات وصول</h2>
<div class="card">
<input id="name" placeholder="اسم المنتج">
<input id="price" type="number" placeholder="السعر">
<input id="qty" type="number" placeholder="الكمية">
<button onclick="addProduct()">إضافة</button>
</div>
<div class="card">
<table><thead><tr><th>الاسم</th><th>السعر</th><th>الكمية</th><th>بيع</th><th>حذف</th></tr></thead><tbody></tbody></table>
</div>
<script>
const API="/api/products";
async function load(){let r=await fetch(API);let d=await r.json();let b=document.querySelector('tbody');b.innerHTML="";d.forEach(p=>{b.innerHTML+=`<tr><td>${p.name}</td><td>${p.price}</td><td>${p.quantity}</td><td><input id="sell-${p.id}" type="number" value="1" style="width:50px"><button onclick="sell(${p.id})">بيع</button></td><td><button onclick="del(${p.id})">X</button></td></tr>`})}
async function addProduct(){let body={name:document.getElementById('name').value,price:parseFloat(document.getElementById('price').value),quantity:parseInt(document.getElementById('qty').value)};await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('qty').value='';load()}
async function sell(id){let q=document.getElementById('sell-'+id).value;let r=await fetch(API+'/'+id+'/sell?qty='+q,{method:'POST'});alert(await r.text());load()}
async function del(id){await fetch(API+'/'+id,{method:'DELETE'});load()}load();
</script></body></html>
