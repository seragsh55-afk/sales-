<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام مبيعات وصول PRO</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f1f5f9;margin:0;padding:0}
#login{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:99}
.login-card{background:white;padding:30px;border-radius:16px;width:90%;max-width:350px;text-align:center}
.card{background:white;padding:18px;border-radius:14px;box-shadow:0 1px 4px #0001;margin:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.stat{background:#0f172a;color:white;padding:15px;border-radius:12px;text-align:center}
.stat b{font-size:22px;display:block}
input,button{padding:10px 14px;border-radius:8px;border:1px solid #ddd}
button{background:#0f172a;color:white;border:0;cursor:pointer;font-weight:bold}
button.green{background:#16a34a}button.red{background:#dc2626}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:14px}
.flex{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
@media print{.no-print{display:none!important} body{background:white}}
</style>
</head>
<body>

<div id="login">
<div class="login-card">
<h2>نظام مبيعات وصول</h2>
<p>ادخل كلمة السر</p>
<input id="pass" type="password" placeholder="wusul123" style="width:100%;margin:10px 0">
<button onclick="checkPass()" style="width:100%">دخول</button>
<p style="font-size:12px;color:#888;margin-top:10px">كلمة السر الافتراضية: wusul123</p>
</div>
</div>

<div class="no-print">
<div class="card"><h2 style="margin:0">نظام مبيعات وصول PRO</h2><div style="color:#64748b">wusul-sales.onrender.com</div></div>

<div class="card stats">
<div class="stat"><span>عدد المنتجات</span><b id="s1">0</b></div>
<div class="stat"><span>كمية المخزن</span><b id="s2">0</b></div>
<div class="stat"><span>قيمة المخزن</span><b id="s3">0 SDG</b></div>
<div class="stat" style="background:#16a34a"><span>مبيعات اليوم</span><b id="s4">0 SDG</b></div>
</div>

<div class="card">
<h3>إضافة منتج</h3>
<div class="flex">
<input id="name" placeholder="اسم المنتج" style="flex:1">
<input id="price" type="number" placeholder="السعر" style="width:120px">
<input id="qty" type="number" placeholder="الكمية" style="width:100px">
<button onclick="addProduct()">إضافة +</button>
</div>
</div>

<div class="card">
<div class="flex" style="justify-content:space-between;align-items:center">
<h3 style="margin:0">المنتجات</h3>
<input id="search" placeholder="بحث..." oninput="load()" style="width:200px">
<button onclick="printInv()" class="green no-print">🖨️ طباعة تقرير</button>
</div>
<table><thead><tr><th>الاسم</th><th>السعر</th><th>الكمية</th><th>بيع</th><th>حذف</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
<h3>سجل المبيعات اليوم</h3>
<table id="salesLog"><thead><tr><th>الوقت</th><th>المنتج</th><th>الكمية</th><th>المجموع</th></tr></thead><tbody></tbody></table>
<button onclick="clearSales()" class="red" style="margin-top:10px">مسح السجل</button>
</div>
</div>

<div id="printArea" style="display:none;padding:20px">
<h2>فاتورة - نظام وصول</h2><p id="printDate"></p>
<div id="printContent"></div>
</div>

<script>
const API="/api/products";
function checkPass(){if(document.getElementById('pass').value==='wusul123'){document.getElementById('login').style.display='none';load()}else alert('كلمة السر خطأ! جرب wusul123')}
let allProducts=[];
async function load(){
let r=await fetch(API);let d=await r.json();allProducts=d;
let q=document.getElementById('search').value.toLowerCase();
let filtered=d.filter(p=>p.name.toLowerCase().includes(q));
let tbody=document.querySelector('table tbody');tbody.innerHTML="";
let totalQty=0,totalVal=0;
d.forEach(p=>{totalQty+=p.quantity;totalVal+=p.price*p.quantity});
filtered.forEach(p=>{
tbody.innerHTML+=`<tr><td>${p.name}</td><td>${p.price}</td><td>${p.quantity}</td><td><div class="flex"><input id="sell-${p.id}" type="number" value="1" style="width:60px"><button class="green" onclick="sell(${p.id},'${p.name}',${p.price})">بيع</button></div></td><td><button class="red" onclick="del(${p.id})">X</button></td></tr>`
});
document.getElementById('s1').innerText=d.length;
document.getElementById('s2').innerText=totalQty;
document.getElementById('s3').innerText=totalVal+" SDG";
updateSalesTotal();
}
async function addProduct(){
let body={name:document.getElementById('name').value,price:parseFloat(document.getElementById('price').value),quantity:parseInt(document.getElementById('qty').value)};
if(!body.name||!body.price)return alert('اكمل البيانات');
await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('qty').value='';
load();
}
async function sell(id,name,price){
let qty=parseInt(document.getElementById('sell-'+id).value);
let res=await fetch(API+'/'+id+'/sell?qty='+qty,{method:'POST'});
let txt=await res.text();
if(res.ok){
let sales=JSON.parse(localStorage.getItem('sales')||'[]');
sales.push({time:new Date().toLocaleString('ar-SD'),name,qty,total:qty*price});
localStorage.setItem('sales',JSON.stringify(sales));
renderSales();alert('تم البيع: '+name);
}else alert(txt);
load();
}
async function del(id){if(confirm('حذف؟')){await fetch(API+'/'+id,{method:'DELETE'});load()}}
function renderSales(){
let sales=JSON.parse(localStorage.getItem('sales')||'[]');
let tb=document.querySelector('#salesLog tbody');tb.innerHTML="";
let total=0;
sales.forEach(s=>{total+=s.total;tb.innerHTML+=`<tr><td>${s.time}</td><td>${s.name}</td><td>${s.qty}</td><td>${s.total}</td></tr>`});
document.getElementById('s4').innerText=total+" SDG";
}
function updateSalesTotal(){renderSales()}
function clearSales(){if(confirm('مسح سجل اليوم؟')){localStorage.removeItem('sales');renderSales()}}
function printInv(){
document.getElementById('printDate').innerText=new Date().toLocaleString();
let sales=JSON.parse(localStorage.getItem('sales')||'[]');
let html="<h3>المنتجات الحالية</h3><table border=1 style='width:100%'><tr><th>الاسم</th><th>السعر</th><th>الكمية</th></tr>"+allProducts.map(p=>`<tr><td>${p.name}</td><td>${p.price}</td><td>${p.quantity}</td></tr>`).join('')+"</table><h3>مبيعات اليوم</h3><table border=1 style='width:100%'><tr><th>المنتج</th><th>الكمية</th><th>المجموع</th></tr>"+sales.map(s=>`<tr><td>${s.name}</td><td>${s.qty}</td><td>${s.total}</td></tr>`).join('')+"</table>";
document.getElementById('printContent').innerHTML=html;
let w=window.open('','','width=800,height=600');w.document.write(document.getElementById('printArea').innerHTML);w.print();
}
renderSales();
</script>
</body>
</html>
